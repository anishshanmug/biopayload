; PlatformIO Project Configuration File
;
; Single-board config: Arduino Nano ESP32 (USB-C).
; All other boards / envs have been removed.
;
; Build & upload:  pio run -e component_dev -t upload
; Monitor:         pio device monitor -e component_dev

[platformio]
default_envs = component_dev

; Shared settings (all envs are Nano ESP32)
[env]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
upload_speed = 115200
monitor_speed = 115200
; Headers live under src/components/; keep #include "components/..." working.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/src
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; Primary firmware: well-plate scan demo (RGB LED + AS7341 + stepper + pump + SD).
[env:component_dev]
build_src_filter = +<main_component_dev.cpp>
lib_deps =
    adafruit/Adafruit AS7341
    arduino-libraries/SD@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
