; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

; Shared settings for all environments
[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 115200

; Main firmware (default)
[env:nanoatmega328]
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/SD@^1.3.0
build_src_filter = +<main.cpp>

; Component dev - Arduino Nano ESP32 (USB-C) with RGB LED + AS7341.
[env:component_dev]
platform = espressif32
board = arduino_nano_esp32
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_src_filter = +<main_component_dev.cpp>
lib_deps = adafruit/Adafruit AS7341

; Nano component dev (pump + spectral sensor).  pio run -e nano_component_dev -t upload
[env:nano_component_dev]
build_src_filter = +<nano_component_dev.cpp>
lib_deps = adafruit/Adafruit AS7341

; Nano AS7341 sensor test.  pio run -e nano_as7341_test -t upload
[env:nano_as7341_test]
build_src_filter = +<nano_as7341_test.cpp>
lib_deps = adafruit/Adafruit AS7341

; Uno component dev (actuator board).  pio run -e uno_component_dev -t upload
[env:uno_component_dev]
board = uno
build_src_filter = +<uno_component_dev.cpp>

; Stepper test - Nano ESP32, just moves stepper back and forth
[env:stepper_test]
platform = espressif32
board = arduino_nano_esp32
upload_protocol = esptool
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_src_filter = +<stepper_test.cpp>

; SD card test firmware
; Build: pio run -e sd_test
; Upload: pio run -e sd_test -t upload
[env:sd_test]
lib_deps = arduino-libraries/SD@^1.3.0
build_src_filter = +<sd_test.cpp>
