; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

; Shared settings for all environments
[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 115200

; Main firmware (default)
[env:nanoatmega328]
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/SD@^1.3.0
build_src_filter = +<main.cpp>

; Component dev - BOTH components on one board (e.g. Nano with pump + actuator).
[env:component_dev]
build_src_filter = +<main_component_dev.cpp>

; Nano component dev (pump + spectral sensor).  pio run -e nano_component_dev -t upload
[env:nano_component_dev]
build_src_filter = +<nano_component_dev.cpp>
lib_deps = adafruit/Adafruit AS7341

; Nano AS7341 sensor test.  pio run -e nano_as7341_test -t upload
[env:nano_as7341_test]
build_src_filter = +<nano_as7341_test.cpp>
lib_deps = adafruit/Adafruit AS7341

; Uno component dev (actuator board).  pio run -e uno_component_dev -t upload
[env:uno_component_dev]
board = uno
build_src_filter = +<uno_component_dev.cpp>

; SD card test firmware
; Build: pio run -e sd_test
; Upload: pio run -e sd_test -t upload
[env:sd_test]
lib_deps = arduino-libraries/SD@^1.3.0
build_src_filter = +<sd_test.cpp>
